<!doctype html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Interview Questions</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				background-color: #f0f4f8;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				padding: 24px;
			}

			h2 {
				text-align: center;
				margin-bottom: 28px;
				font-size: 28px;
				color: #1a202c;
				letter-spacing: 0.5px;
			}

			/* ── Category Sections ── */
			.category-section {
				margin-bottom: 16px;
			}

			.category-header {
				width: 100%;
				display: flex;
				align-items: center;
				justify-content: space-between;
				background: #1a202c;
				color: #fff;
				border: none;
				border-radius: 10px;
				padding: 14px 18px;
				font-size: 16px;
				font-weight: 600;
				cursor: pointer;
				letter-spacing: 0.3px;
				transition: background 0.15s ease;
			}

			.category-header:hover {
				background: #2d3748;
			}

			.category-count {
				font-size: 12px;
				font-weight: 400;
				color: #a0aec0;
				margin-left: 6px;
			}

			.chevron {
				font-size: 13px;
				transition: transform 0.2s ease;
			}

			.category-section.open .chevron {
				transform: rotate(180deg);
			}

			/* ── Grid Container ── */
			.cards-container {
				display: none;
				grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
				gap: 18px;
				margin-top: 16px;
			}

			.category-section.open .cards-container {
				display: grid;
			}

			/* ── Card ── */
			.card {
				background: #ffffff;
				border-radius: 12px;
				padding: 18px 16px 14px;
				cursor: pointer;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
				border: 1px solid #e2e8f0;
				transition:
					transform 0.18s ease,
					box-shadow 0.18s ease;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				min-height: 110px;
			}

			.card:hover {
				transform: translateY(-4px);
				box-shadow: 0 8px 20px rgba(0, 0, 0, 0.13);
				border-color: #90cdf4;
			}

			/* Question text — max 3 lines */
			.card-question {
				font-size: 14px;
				font-weight: 600;
				color: #2d3748;
				line-height: 1.55;
				display: -webkit-box;
				-webkit-line-clamp: 3;
				-webkit-box-orient: vertical;
				overflow: hidden;
				text-overflow: ellipsis;
				flex: 1;
			}

			/* Bottom hint */
			.card-hint {
				margin-top: 10px;
				font-size: 11px;
				color: #a0aec0;
				text-align: right;
				letter-spacing: 0.3px;
			}

			/* ── Modal Overlay ── */
			.modal-overlay {
				display: none;
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.45);
				z-index: 1000;
				align-items: center;
				justify-content: center;
				padding: 20px;
			}

			.modal-overlay.active {
				display: flex;
			}

			/* ── Modal Box ── */
			.modal-box {
				background: #ffffff;
				border-radius: 14px;
				padding: 28px 30px 24px;
				max-width: 560px;
				width: 100%;
				max-height: 80vh;
				overflow-y: auto;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
				position: relative;
				animation: popIn 0.2s ease;
			}

			@keyframes popIn {
				from {
					transform: scale(0.92);
					opacity: 0;
				}
				to {
					transform: scale(1);
					opacity: 1;
				}
			}

			.modal-close {
				position: absolute;
				top: 14px;
				right: 18px;
				font-size: 22px;
				color: #718096;
				cursor: pointer;
				line-height: 1;
				background: none;
				border: none;
				transition: color 0.15s;
			}

			.modal-close:hover {
				color: #e53e3e;
			}

			.modal-question {
				font-size: 16px;
				font-weight: 700;
				color: #1a202c;
				margin-bottom: 16px;
				padding-right: 24px;
				line-height: 1.5;
				border-bottom: 2px solid #ebf4ff;
				padding-bottom: 12px;
			}

			.modal-answer {
				font-size: 14px;
				color: #4a5568;
				line-height: 1.75;
			}

			.modal-answer p {
				margin-bottom: 10px;
			}

			.modal-answer p:last-child {
				margin-bottom: 0;
			}

			.modal-answer pre {
				background: #f7fafc;
				border: 1px solid #e2e8f0;
				border-radius: 6px;
				padding: 10px 12px;
				overflow-x: auto;
				margin-bottom: 10px;
			}

			.modal-answer pre code {
				font-family: "Fira Code", Consolas, Menlo, monospace;
				font-size: 12.5px;
				color: #2d3748;
				white-space: pre;
			}
		</style>
	</head>
	<body>
		<h2>Interview Questions</h2>

		<div id="questionsContainer">
		</div>

		<!-- ── Modal ── -->
		<div class="modal-overlay" id="modalOverlay">
			<div class="modal-box">
				<button class="modal-close" id="modalClose">&times;</button>
				<div class="modal-question" id="modalQuestion"></div>
				<div class="modal-answer" id="modalAnswer"></div>
			</div>
		</div>

		<script>

			const questionsData = [
    {
        "category": "JavaScript",

        "answer": "<p>\r\n\t\t\t\t\t\tHoisting is js's default behaviour of putting all the declarations\r\n\t\t\t\t\t\tto the top of current scope or current function before executing the\r\n\t\t\t\t\t\tcode.\r\n\t\t\t\t\t</p>\r\n\t\t\t\t\t<p>\r\n\t\t\t\t\t\tHoisting is the process of setting up memory space for its variables\r\n\t\t\t\t\t\tand functions; the values of variables are not stored but the\r\n\t\t\t\t\t\tfunctions are stored entirely along with their definitions.\r\n\t\t\t\t\t</p>\r\n\t\t\t\t\t<p>\r\n\t\t\t\t\t\tIt's like the engine writes on a piece of paper the variables and\r\n\t\t\t\t\t\tfunctions it needs to keep track of before actually running the\r\n\t\t\t\t\t\tcode.\r\n\t\t\t\t\t</p>"
    },
    {
        "category": "JavaScript",
        "question": "Closure",

    {
        "category": "JavaScript",

    },
    {
        "category": "JavaScript",

    },
    {
        "category": "JavaScript",
        "question": "slice vs splice",
        "answer": "<p>\r\n\t\t\t\t\t\t<strong>splice()</strong> — returns the removed item(s) in an array.\r\n\t\t\t\t\t\tChanges the original array. Can take n number of arguments:\r\n\t\t\t\t\t\tsplice(index, count, newItem).\r\n\t\t\t\t\t</p>\r\n\t\t\t\t\t<p>\r\n\t\t\t\t\t\t<strong>slice()</strong> — returns the selected element(s) in an\r\n\t\t\t\t\t\tarray as a new array object. Does NOT change the original array.\r\n\t\t\t\t\t\tTakes 2 arguments.\r\n\t\t\t\t\t</p>"

    {

    {
        "category": "JavaScript",
        "question": "Block",
        "answer": "<p>\r\n\t\t\t\t\t\tA block is a place where multiple statements are grouped together so\r\n\t\t\t\t\t\tthat we can use it where JavaScript expects one single statement.\r\n\t\t\t\t\t</p>"

    {

    {
        "category": "JavaScript",
        "question": "Pure Function",

    {

    {
        "category": "JavaScript",

    },
    {
        "category": "JavaScript",
        "question": "useRef",
        "answer": "<p>\r\n\t\t\t\t\t\tThe useRef Hook lets us create mutable variables inside functional\r\n\t\t\t\t\t\tcomponents.\r\n\t\t\t\t\t</p>\r\n\t\t\t\t\t<p>\r\n\t\t\t\t\t\tCalling useRef(initialValue) returns a reference object with a\r\n\t\t\t\t\t\t<strong>current</strong> property.\r\n\t\t\t\t\t</p>\r\n\t\t\t\t\t<p>The value of the reference is persistent between re-renders.</p>\r\n\t\t\t\t\t<p>\r\n\t\t\t\t\t\tUpdating a reference does NOT trigger component re-rendering (unlike\r\n\t\t\t\t\t\tstate).\r\n\t\t\t\t\t</p>"

    {
        "category": "JavaScript",
        "question": "useMemo",
        "answer": "<p>\r\n\t\t\t\t\t\tuseMemo() is a built-in React hook that accepts a compute function\r\n\t\t\t\t\t\tand a dependencies array.\r\n\t\t\t\t\t</p>\r\n\t\t\t\t\t<p>\r\n\t\t\t\t\t\tOn initial render it invokes compute, memoizes the result, and\r\n\t\t\t\t\t\treturns it.\r\n\t\t\t\t\t</p>\r\n\t\t\t\t\t<p>\r\n\t\t\t\t\t\tIf dependencies don't change on re-render, useMemo returns the\r\n\t\t\t\t\t\tmemoized value without re-computing.\r\n\t\t\t\t\t</p>\r\n\t\t\t\t\t<p>\r\n\t\t\t\t\t\tReact.memo is a higher order function that takes a functional\r\n\t\t\t\t\t\tcomponent and returns an optimized version that updates only on\r\n\t\t\t\t\t\tprops change.\r\n\t\t\t\t\t</p>"

        "category": "JavaScript",

    {
        "category": "JavaScript",
        "question": "Promise",
        "answer": "<p>\r\n\t\t\t\t\t\tThe Promise object represents the eventual completion (or failure)\r\n\t\t\t\t\t\tof an asynchronous operation and its resulting value.\r\n\t\t\t\t\t</p>\r\n\t\t\t\t\t<p>\r\n\t\t\t\t\t\tA Promise is something we don't know the value of yet, but the value\r\n\t\t\t\t\t\twill become available in the future.\r\n\t\t\t\t\t</p>\r\n\t\t\t\t\t<p>\r\n\t\t\t\t\t\tIt is one way to deal with asynchronous code without getting stuck\r\n\t\t\t\t\t\tin callback hell.\r\n\t\t\t\t\t</p>\r\n\t\t\t\t\t<p><strong>3 states:</strong> Pending → Fulfilled / Rejected.</p>\r\n\t\t\t\t\t<p>\r\n\t\t\t\t\t\tthen() — called on success. catch() — called on failure. finally() —\r\n\t\t\t\t\t\talways called.\r\n\t\t\t\t\t</p>"

			const categoryLabels = {
				"JavaScript": "JS",
				"TypeScript": "TS",
				"React Native": "RN"
			};

			const grouped = questionsData.reduce(function (acc, q) {
				(acc[q.category] = acc[q.category] || []).push(q);
				return acc;
			}, {});

			const container = document.querySelector("#questionsContainer");

			const sectionsHTML = categoryOrder
				.filter(cat => grouped[cat] && grouped[cat].length)
				.map(cat => {
					const cardsHTML = grouped[cat].map(q => `
					<div class="card" data-question="${q.question}">
						<div class="card-question">${q.question}</div>
						<div class="card-answer" style="display: none">
${q.answer}
						</div>
						<div class="card-hint">tap to expand ↗</div>
					</div>`).join('');

					return `
					<div class="category-section">
						<button class="category-header" type="button">
							<span>${categoryLabels[cat]}<span class="category-count">(${grouped[cat].length})</span></span>
							<span class="chevron">▾</span>
						</button>
						<div class="cards-container">${cardsHTML}</div>
					</div>`;
				}).join('');

			container.innerHTML = sectionsHTML;

			// Toggle category open/closed
			document.querySelectorAll(".category-header").forEach(function (header) {
				header.addEventListener("click", function () {
					header.closest(".category-section").classList.toggle("open");
				});
			});

			const overlay = document.getElementById("modalOverlay");
			const modalQ = document.getElementById("modalQuestion");
			const modalA = document.getElementById("modalAnswer");
			const modalClose = document.getElementById("modalClose");

			// Open modal on card click
			document.querySelectorAll(".card").forEach(function (card) {
				card.addEventListener("click", function () {
					const question = card.getAttribute("data-question");
					const answerEl = card.querySelector(".card-answer");
					modalQ.textContent = question;
					modalA.innerHTML = answerEl.innerHTML;
					overlay.classList.add("active");
				});
			});

			// Close on × button
			modalClose.addEventListener("click", function () {
				overlay.classList.remove("active");
			});

			// Close on overlay background click
			overlay.addEventListener("click", function (e) {
				if (e.target === overlay) {
					overlay.classList.remove("active");
				}
			});

			// Close on Escape key
